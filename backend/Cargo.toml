[package]
name = "stardate"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "time"] }
time = { version = "0.3.55", features = ["serde-human-readable"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
