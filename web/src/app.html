<!doctype html>
<html lang="en" data-theme="cerberus" data-mode="light">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Runs before first paint so the stored theme never flashes the default one
			(() => {
				const themes = ['cerberus', 'catppuccin', 'pine', 'rose'];
				const read = (key) => {
					try {
						return localStorage.getItem(key);
					} catch {
						return null;
					}
				};
				const theme = read('stardate-theme');
				const mode = read('stardate-mode');
				const prefersDark = matchMedia('(prefers-color-scheme: dark)').matches;
				const root = document.documentElement;
				if (themes.includes(theme)) root.dataset.theme = theme;
				root.dataset.mode =
					mode === 'light' || mode === 'dark' ? mode : prefersDark ? 'dark' : 'light';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
