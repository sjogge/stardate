services:
  api:
    build:
      context: ./backend
      target: final
    ports:
      - '3000:3000'
    volumes:
      - stardate-data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m
    read_only: true # root filesystem read-only; /data volume stays writable
    cap_drop: [ALL] # app needs no Linux capabilities
    security_opt: ['no-new-privileges:true']
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 1m
      timeout: 3s
      retries: 3
    environment:
      DATABASE_URL: sqlite:///data/stardate.db
      BIND_ADDR: 0.0.0.0:3000
      RUST_LOG: stardate=info,tower_http=info
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: '3'

volumes:
  stardate-data:
